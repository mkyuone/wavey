<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AudioNavigator</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preload" href="assets/fonts/ibm-plex-sans/IBMPlexSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/ibm-plex-sans/IBMPlexSans-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="app-title">AudioNavigator</p>
        <div class="header-actions">
          <div class="language-control">
            <span class="material-symbols-sharp ui-icon" aria-hidden="true">language</span>
            <span class="sr-only" data-i18n="language">Language</span>
            <button
              id="languageSelect"
              type="button"
              class="language-button"
              value="en"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="languageMenu"
              aria-label="Language"
              data-i18n-aria="language"
            >
              <span class="language-value">English</span>
              <span class="material-symbols-sharp ui-icon" aria-hidden="true">expand_more</span>
            </button>
            <div id="languageMenu" class="custom-menu language-menu is-hidden" role="listbox" aria-label="Language">
              <button type="button" role="option" data-value="en" aria-selected="true">English</button>
              <button type="button" role="option" data-value="es">Español</button>
              <button type="button" role="option" data-value="fr">Français</button>
              <button type="button" role="option" data-value="de">Deutsch</button>
              <button type="button" role="option" data-value="pt-BR">Português (Brasil)</button>
              <button type="button" role="option" data-value="ru">Русский</button>
              <button type="button" role="option" data-value="hi">हिन्दी</button>
              <button type="button" role="option" data-value="ja">日本語</button>
              <button type="button" role="option" data-value="ko">한국어</button>
              <button type="button" role="option" data-value="zh-CN">简体中文</button>
              <button type="button" role="option" data-value="zh-TW">繁體中文</button>
            </div>
          </div>
          <label class="file-button">
            <input id="fileInput" type="file" accept="audio/*">
            <span class="material-symbols-sharp ui-icon" aria-hidden="true">audio_file</span>
            <span data-i18n="openAudio">Open audio</span>
          </label>
        </div>
      </header>

      <section id="dropZone" class="drop-zone" aria-label="Audio file upload" data-i18n-aria="audioFileUpload">
        <div class="drop-copy">
          <strong data-i18n="dropAudio">Drop an audio file here</strong>
          <p class="privacy-note" data-i18n="privacyNote">Your file stays private, local, and is not uploaded.</p>
          <p class="format-note" data-i18n="supportedFormats">Supports MP3, WAV, M4A, AAC, OGG, and FLAC.</p>
          <button id="dropOpenButton" type="button">
            <span class="material-symbols-sharp ui-icon" aria-hidden="true">audio_file</span>
            <span data-i18n="openAudio">Open audio</span>
          </button>
        </div>
      </section>

      <section id="playerPanel" class="player-panel is-hidden" aria-label="Waveform player" data-i18n-aria="waveformPlayer">
        <div class="track-meta">
          <div>
            <p id="fileName" class="file-name" data-i18n="noFileLoaded">No file loaded</p>
            <p id="fileDetails" class="file-details">--</p>
          </div>
          <p id="statusText" class="status-text" role="status" data-i18n="ready">Ready</p>
        </div>

        <div class="waveform-wrap">
          <canvas id="waveformCanvas" aria-label="Interactive audio waveform" data-i18n-aria="interactiveWaveform"></canvas>
        </div>

        <div class="time-row">
          <span id="currentTime">0:00</span>
          <input id="timeline" type="range" min="0" max="1000" value="0" aria-label="Playback position" data-i18n-aria="playbackPosition">
          <span id="duration">0:00</span>
        </div>

        <div class="controls-grid">
          <div class="control-row transport-row">
            <button id="playButton" type="button" class="icon-button primary-control" aria-label="Play">
              <span class="material-symbols-sharp ui-icon" aria-hidden="true">play_arrow</span>
              <span data-i18n="play">Play</span>
            </button>
            <button id="nextAudio" type="button" class="icon-button">
              <span class="material-symbols-sharp ui-icon" aria-hidden="true">skip_next</span>
              <span data-i18n="nextSound">Next section</span>
            </button>
            <div class="jump-control" aria-label="Timed jump controls" data-i18n-aria="timedJumpControls">
              <button id="jumpBack" type="button" class="icon-button" aria-label="Jump backward" data-i18n-aria="jumpBackward">
                <span class="material-symbols-sharp ui-icon" aria-hidden="true">fast_rewind</span>
              </button>
              <div class="jump-amount-wrap">
                <button
                  id="jumpAmount"
                  type="button"
                  class="jump-amount-button"
                  value="10"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-controls="jumpAmountMenu"
                  aria-label="Jump amount"
                  data-i18n-aria="jumpAmount"
                >
                  <span class="jump-amount-value">10s</span>
                </button>
                <div id="jumpAmountMenu" class="custom-menu jump-amount-menu is-hidden" role="listbox" aria-label="Jump amount" data-i18n-aria="jumpAmount">
                  <button type="button" role="option" data-value="5">5s</button>
                  <button type="button" role="option" data-value="10" aria-selected="true">10s</button>
                  <button type="button" role="option" data-value="30">30s</button>
                  <button type="button" role="option" data-value="60">60s</button>
                </div>
              </div>
              <button id="jumpForward" type="button" class="icon-button" aria-label="Jump forward" data-i18n-aria="jumpForward">
                <span class="material-symbols-sharp ui-icon" aria-hidden="true">fast_forward</span>
              </button>
            </div>
            <div class="volume-control">
              <label for="volumeSlider">
                <span class="material-symbols-sharp ui-icon" aria-hidden="true">volume_up</span>
                <span class="sr-only" data-i18n="volume">Volume</span>
              </label>
              <input id="volumeSlider" type="range" min="0" max="300" step="10" value="100" data-i18n-aria="volume">
              <output id="volumeValue" for="volumeSlider">100%</output>
            </div>
            <label class="speed-control">
              <span class="control-label">
                <span class="material-symbols-sharp ui-icon" aria-hidden="true">speed</span>
                <span class="sr-only" data-i18n="speed">Speed</span>
              </span>
              <input id="speedSlider" type="range" min="0.25" max="3" step="0.25" value="1" data-i18n-aria="speed">
              <output id="speedValue" for="speedSlider">1.00x</output>
            </label>
          </div>
        </div>
      </section>

      <footer class="app-footer">
        AudioNavigator v0.2 | &copy; 2026 Mark Yu
      </footer>
    </main>

    <div id="loadingOverlay" class="loading-overlay is-hidden" role="status" aria-live="polite" aria-busy="true">
      <div class="loader">
        <strong id="loadingTitle" data-i18n="processingAudio">Processing audio</strong>
        <span id="loadingDetail" data-i18n="preparingWaveform">Preparing waveform...</span>
        <div class="progress-track" aria-hidden="true">
          <span id="loadingProgressBar"></span>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
