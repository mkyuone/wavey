<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SoundFinder</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="app-title">SoundFinder</p>
        <div class="header-actions">
          <label class="language-control">
            <span class="sr-only" data-i18n="language">Language</span>
            <select id="languageSelect" aria-label="Language">
              <option value="en" selected>English</option>
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW" hidden>繁體中文</option>
            </select>
          </label>
          <label class="file-button">
            <input id="fileInput" type="file" accept="audio/*">
            <span data-i18n="openAudio">Open audio</span>
          </label>
        </div>
      </header>

      <section id="dropZone" class="drop-zone" aria-label="Audio file upload" data-i18n-aria="audioFileUpload">
        <div class="drop-copy">
          <strong data-i18n="dropAudio">Drop an audio file here</strong>
          <button id="dropOpenButton" type="button" data-i18n="openAudio">Open audio</button>
        </div>
      </section>

      <section id="playerPanel" class="player-panel is-hidden" aria-label="Waveform player" data-i18n-aria="waveformPlayer">
        <div class="track-meta">
          <div>
            <p id="fileName" class="file-name" data-i18n="noFileLoaded">No file loaded</p>
            <p id="fileDetails" class="file-details">--</p>
          </div>
          <p id="statusText" class="status-text" role="status" data-i18n="ready">Ready</p>
        </div>

        <div class="waveform-wrap">
          <canvas id="waveformCanvas" aria-label="Interactive audio waveform" data-i18n-aria="interactiveWaveform"></canvas>
        </div>

        <div class="time-row">
          <span id="currentTime">0:00</span>
          <input id="timeline" type="range" min="0" max="1000" value="0" aria-label="Playback position" data-i18n-aria="playbackPosition">
          <span id="duration">0:00</span>
        </div>

        <div class="controls-grid">
          <div class="control-row transport-row">
            <button id="playButton" type="button" class="icon-button primary-control" aria-label="Play">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5v14l11-7z"></path>
              </svg>
              <span data-i18n="play">Play</span>
            </button>
            <button id="nextAudio" type="button" class="icon-button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 5v14l8-7zM14 5v14h3V5z"></path>
              </svg>
              <span data-i18n="nextSound">Next sound</span>
            </button>
            <div class="jump-control" aria-label="Timed jump controls" data-i18n-aria="timedJumpControls">
              <button id="jumpBack" type="button" class="icon-button" aria-label="Jump backward" data-i18n-aria="jumpBackward">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M11 18V6l-8.5 6zM20 18V6l-8.5 6z"></path>
                </svg>
              </button>
              <select id="jumpAmount" aria-label="Jump amount" data-i18n-aria="jumpAmount">
                <option value="5">5s</option>
                <option value="10" selected>10s</option>
                <option value="30">30s</option>
                <option value="60">60s</option>
              </select>
              <button id="jumpForward" type="button" class="icon-button" aria-label="Jump forward" data-i18n-aria="jumpForward">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M13 6v12l8.5-6zM4 6v12l8.5-6z"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="control-row settings-row">
            <div class="volume-control">
              <label for="volumeSlider" data-i18n="volume">Volume</label>
              <input id="volumeSlider" type="range" min="0" max="300" step="10" value="100" data-i18n-aria="volume">
              <output id="volumeValue" for="volumeSlider">100%</output>
            </div>
            <label class="speed-control">
              <span data-i18n="speed">Speed</span>
              <input id="speedSlider" type="range" min="0.25" max="3" step="0.25" value="1" data-i18n-aria="speed">
              <output id="speedValue" for="speedSlider">1x</output>
            </label>
          </div>
        </div>
      </section>

      <footer class="app-footer">
        SoundFinder v0.1 | &copy; 2026 Mark Yu
      </footer>
    </main>

    <audio id="audio"></audio>
    <div id="loadingOverlay" class="loading-overlay is-hidden" role="status" aria-live="polite" aria-busy="true">
      <div class="loader">
        <strong id="loadingTitle" data-i18n="processingAudio">Processing audio</strong>
        <span id="loadingDetail" data-i18n="preparingWaveform">Preparing waveform...</span>
        <div class="progress-track" aria-hidden="true">
          <span id="loadingProgressBar"></span>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
